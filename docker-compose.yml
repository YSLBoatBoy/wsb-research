services:
  wsb-research:
    image: ghcr.io/yslboatboy/wsb-research:latest
    container_name: wsb-research
    restart: unless-stopped
    user: "99:100"
    ports:
      - "8088:8080"
    volumes:
      - /mnt/user/appdata/wsb-research:/data
    environment:
      TZ: America/Chicago
      PAPER_TIME: "08:15"
      ANALYZE_DAY: sun
      ANALYZE_TIME: "18:00"
      ANALYZE_DAYS: "120"
      PAPER_CAPITAL: "100000"
    labels:
      net.unraid.docker.webui: "http://[IP]:[PORT:8088]/"
